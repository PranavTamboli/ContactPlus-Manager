<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
				th:replace="~{base::layout(~{::section})}">
<head>
	<meta charset="UTF-8" />
	<title>Home page</title>	
</head>
<body>
	<section >
		<div class="card mr-3 ml-3" th:if=${contact}>
		
		<div class="card-body" >
		
			<div class="container text-center">
				    <img style="height: 200px; width: 200px;" class="my_profile_picture" alt="profile" src="" th:src="@{'/img/'+${contact.image}}">
					
					<h3 class="mt-3"><span th:text="${contact.name}"></span> <span th:text="${contact.secondName}")></span></h3>
				
				<table class="table">
				  <thead>
				    <tr>
				      <th scope="col">#ID</th>
				      <th scope="col">SCMUSER<span th:text="${contact.cId}"></span></th>	
				  </thead>
				  <tbody>
				    <tr>
				      <th scope="row">Email</th>
				      <td><span th:text="${contact.email}"></span></td>
				  
				    </tr>
				   <tr>
				      <th scope="row">phone</th>
				      <td><span th:text="${contact.phone}"></span></td>
				  
				    </tr>
				       <tr>
				      <th scope="row">work</th>
				      <td><span th:text="${contact.work}"></span></td>
				  
				    </tr>
			  </tbody>
				</table>
				
				<div class="description">
					<th:block th:text="${contact.description}"></th:block>
				</div>
			
				<div class="container mt-3">
					<!-- dynamic data bhej paye -->
						<a th:href="@{'/user/delete/'+${contact.cId}}" class="btn btn-danger btn-sm btn-block">Delete </a>
							<form method="post" th:action="@{'/user/update-contact/'+${contact.cId}}" class="mt-2">
							<button type="submit" class="btn btn-block btn-primary btn-sm">Update</button>
						</form>
				  	
				</div>
			</div>
		
		</div>
			
		</div>
		
		<h1 class="text-center p-3 bg-danger" th:unless="${contact}">You don't have permission to see this contact</h1>
		
	</section>
</body>
</html>

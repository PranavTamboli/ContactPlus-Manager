<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
					th:replace="~{normal/base::layout(~{::section})}">
				<!--th:replace="normal/base::layout(~{::section})"> -->
<head>
	<meta charset="UTF-8" />
	<title>Contact page</title>	
</head>
<body>
	<section >
		<div class="card mr-3 ml-3">
			<div class="card-body">
				<h1 class="text-center">Your Contacts</h1>
				
				<!-- Searching in contactsss -->
				
				<div class="search-container my-4">	
				<input onkeyup="search()" id="search-input" type="text" class="form-control" placeholder="search your contacts"/>
					
					<!-- css apply karna padega like google jaisa ana chahiye search bar -->
					<div class="search-result">
					
						<!--background me search karne ke bad ya Result show karana hai-->
						
					</div>
				</div>
				
				<div class="table-responsive">
				<table class="table table-hover">
			  <thead>
			    <tr>
			      <th scope="col">#ID</th>
			      <th scope="col">Name</th>
			      <th scope="col">Email</th>
			      <th scope="col">Phone</th>
			      <th scope="col">Action</th>
			    </tr>
			  </thead>
			  <tbody>
			  
			    <tr th:each="c : ${contacts}">
			      <th scope="row" th:text="${'SCM'+c.cId}">1</th>
			      
			      <td>
			      <img class="my_profile_picture" alt="profile" src="" th:src="@{'/img/'+${c.image}}">
			      <span th:text="${c.name}"></span></td>
			      
			      <td>
			      <a href:"#" th:href="@{'/user/'+${c.cId}+'/contact'}">
			      	<span th:text="${c.email}"></span>
			      </a>
			      </td>
			      
			      <td th:text="${c.phone}">@mdo</td>
			      <td>
						<a th:href="@{'/user/delete/'+${c.cId}}" class="btn btn-danger btn-sm">Delete</a>
						
						<form method="post" th:action="@{'/user/update-contact/'+${c.cId}}" class="mt-2">
							<button type="submit" class="btn btn-primary btn-sm">Update</button>
						</form>
				  	
				  
				  </td>
			    </tr>
			  </tbody>
			</table>
			</div>
			
			<!-- Pagination Part -->
			
		 <nav aria-label="Page navigation example">
		  <ul class="pagination">
		  				<!-- 0  !=  0  nahi dikahana hai tb -->
		    <li th:if="${currentpage != 0}" class="page-item"><a th:href="@{'/user/show-contacts/'+${currentpage-1}}" class="page-link" href="#">Previous</a></li>
		    	
		    <li th:classappend="${currentpage==i-1?'active':''}" th:each="i : ${#numbers.sequence(1, totalPages)}" class="page-item"><a th:href="@{'/user/show-contacts/'+${i-1}}" class="page-link" href="#"><span th:text="${i}"></span></a></li>
		    
		    <li th:if="${currentpage+1 != totalPages}" class="page-item"><a th:href="@{'/user/show-contacts/'+${currentpage+1}}" class="page-link" href="#">Next</a></li>
		  </ul>
		</nav>
				
				
			</div>
			
		</div>
		<script>
			$(document).ready(() => {
				$(".item").removeClass("active");
				$("#contacts-link").addClass("active");
			});
		</script>
	</section>
</body>
</html>
